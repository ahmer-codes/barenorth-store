<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Biometric</title>
  </head>
  <body>
    <h1>
      <img
        src="Imgs/1770734094459.png"
        alt="BareNorth Logo"
        class="w-24 ml-4"
      />
    </h1>
    <section class="flex items-center flex-col">
      <p class="text-4xl font-semibold mb-4">Take Image</p>
    </section>
    <div class="flex flex-col items-center gap-4">
      <div class="flex justify-center items-center gap-4">
        <!-- <button
          id="openCam"
          class="my-6 py-2 cursor-pointer border-2 w-56 flex justify-center bg-black text-white"
        >
          Open Camera
        </button> -->
        <!-- <button
          id="takePhoto"
          class="my-6 py-2 cursor-pointer border-2 w-56 flex justify-center bg-black text-white"
        >
          Take Photo
        </button> -->

        <!-- <h2>OR</h2> -->

        <!-- <button
          id="upload"
          class="my-6 py-2 cursor-pointer border-2 w-80 flex justify-center bg-black text-white"
        >
          <p class="translate-x-36 cursor-pointer">Upload</p>
          <input
            type="file"
            name="Upload"
            class="text-amber-700 opacity-5 cursor-pointer"
            id="uploaded"
          />
        </button> -->
      </div>

      <div class="flex gap-4">
        <video id="video" class="w-64 hidden" autoplay playsinline></video>
        <canvas id="canvas" style="display: none"></canvas>
        <img id="photo" class="rounded-full w-52 h-52 hidden" alt="" />
      </div>

      <button
        id="continue"
        class="my-6 py-2 cursor-pointer border-2 w-80 flex justify-center bg-black text-white"
        onclick="cont()"
      >
        Continue
      </button>
      <p id="error" style="color: red"></p>
    </div>

    <script>
      const takePhotoBtn = document.getElementById("takePhoto");
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");
      const photo = document.getElementById("photo");

      let currentMail = localStorage.getItem("currentEmail");
      if (!currentMail) {
        window.location.href = "login.html";
      }
      let userDataString = localStorage.getItem(currentMail);
      let userData = JSON.parse(userDataString);

      if (!userData) {
        userData = {};
        localStorage.setItem(currentMail, JSON.stringify(userData));
      }

      let stream;

      async function startCamera() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false,
          });

          video.srcObject = stream;
          video.classList.remove("hidden");
        } catch (err) {
          console.error("Camera access failed:", err);
          document.getElementById("error").innerText =
            "Camera permission denied or not available.";
        }
      }

      startCamera();

      const savedIMG = userData.userIMG;

      async function cont() {
        // takePhotoBtn.addEventListener("click", () => {
        if (!stream) {
          console.log("Camera not started yet");
          return;
        }

        const context = canvas.getContext("2d");

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        const imageData = canvas.toDataURL("image/png");
        photo.src = imageData;
        userData.userIMG = imageData;
        localStorage.setItem(currentMail, JSON.stringify(userData));

        stream.getTracks().forEach((track) => track.stop());
        video.classList.add("hidden");
        photo.classList.remove("hidden");
        // });

        const finalUserData = JSON.parse(localStorage.getItem(currentMail));
        if (!finalUserData || !finalUserData.userIMG) {
          document.getElementById("error").innerHTML =
            "Please take an image first.";
          return;
        }

        let userIP = null;
        try {
          const response = await fetch("https://api.ipify.org?format=json");
          const ipData = await response.json();
          console.log("User IP:", ipData.ip);
          userIP = ipData.ip;
        } catch (error) {
          console.error("Error fetching IP:", error);
        }

        const date = new Date();

        const logEntry = {
          id: Math.floor(1000 + Math.random() * 9000),
          ip: userIP,
          date: date.toLocaleDateString(),
          time: date.toLocaleTimeString(),
          img: userData.userIMG,
        };
        let userLogs =
          JSON.parse(localStorage.getItem(currentMail + "_logs")) || [];

        if (userLogs.length > 3) {
          userLogs.shift();
        }

        userLogs.push(logEntry);

        localStorage.setItem(currentMail + "biometricVerification", true);
        localStorage.setItem(currentMail + "_logs", JSON.stringify(userLogs));

        window.location.href = "home.html";
      }
    </script>
  </body>
</html>
