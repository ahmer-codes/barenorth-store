    <nav

    <section class="flex items-center flex-col mb-4">

    <section
      class="flex max-[700px]:flex-col max-[700px]:gap-10 justify-evenly items-center mb-16"
    >
      <div class="">
        <div class="bg-gray-300 py-2 px-12 pt-6 max-[300px]:px-4 rounded-t-lg">
          <div class="w-48 h-48 rounded-full">
            <img
              id="photo"
              class="w-48 h-48 rounded-full"
              src="Imgs/pfp.png"
              alt=""
            />
          </div>
          <button
            id="upload"
            class="flex flex-col justify-center text-white custom"
          >
            <input
              type="file"
              name="Upload"
              class="text-gray-700 opacity-5 w-24 translate-y-6"
              id="uploaded"
            />
            <p class="cursor-pointer bg-gray-600 customize p-0.5 w-24 text-xs">
              Upload/Update
            </p>
          </button>
        </div>
        <div class="bg-gray-200 p-2 text-center rounded-b-lg">
          <div id="changeYourName" class="my-2 hidden">
            <input
              type="text"
              id="inputEditName"
              placeholder="Edit Your Name"
              pattern="[A-Za-z\s]+"
              class="px-2 py-2 w-28 text-xs border rounded-lg"
              maxlength="20"
              name="name"
              required
            />
            <button
              id="updateBtn"
              class="border bg-gray-700 rounded-full text-xs text-white p-2 cursor-pointer"
              onclick="newName()"
            >
              Update
            </button>
            <button
              class="border bg-gray-700 rounded-full text-xs text-white p-2 cursor-pointer"
              id="cancelEditBtn"
              onclick="canceleditName()"
            >
              Cancel
            </button>
          </div>

            <p id="insertUsername" class="text-4xl font-semibold relative">
              Username

              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="w-3 cursor-pointer absolute z-10"
                id="nameEditBtn"
                viewBox="0 0 512 512"
                onclick="editName()"

                  d="M290.74 93.24l128.02 128.02-277.99 277.99-114.14 12.6C11.35 513.54-1.56 500.62.14 485.34l12.7-114.22 277.9-277.88zm207.2-19.06l-60.11-60.11c-18.75-18.75-49.16-18.75-67.91 0l-56.55 56.55 128.02 128.02 56.55-56.55c18.75-18.76 18.75-49.16 0-67.91z"

        ></div>
        <div class="flex flex-col">

            class="bg-gray-500 text-white bottom-0 px-4 py-2 flex justify-around"
          >
            <span> Total </span><span> : </span>
            <span id="totalAmount">$0</span>
          </p>
          <div class="flex justify-center">
            <button
              id="checkoutbtn"
              class="bg-gray-400 text-black hover:bg-gray-500 hover:text-white bottom-0 cursor-pointer px-4 py-2 rounded-xl mt-2"
              onclick="cont()"
            >
              Checkout
            </button>

  <script>
    let currentMail = localStorage.getItem("currentEmail");
    if (!currentMail || !localStorage.getItem(currentMail + "biometricVerification")) {
      window.location.href = "login.html";
    }
    let userInfoString = localStorage.getItem(currentMail);
    let userInfo = JSON.parse(userInfoString);
    document.getElementById("insertUsername").innerText = userInfo.username;
    let insertMails = document.getElementsByClassName("insertMail");
    for (let x = 0; x < insertMails.length; x++) {
      insertMails[x].innerHTML = currentMail;
    }

    let myMoney = localStorage.getItem(currentMail + "_money");
    console.log(myMoney);

    function getRandomCard(min, max) {
      const genMoney = Math.floor(Math.random() * (max - min) + min);
      return genMoney;
    }

    if (myMoney == null || myMoney == "") {
      const money = getRandomCard(1111, 9999);
      console.log(money);
      localStorage.setItem(currentMail + "_money", money);
    }

    const expiDate = new Date("2030-05-05").toLocaleDateString();
    console.log(expiDate);
    const cardEntries = {
      cardNumber: 88043169502378,
      CVC: 343,
      expDate: expiDate,
    };
    console.log(cardEntries);
    localStorage.setItem("Card", JSON.stringify(cardEntries));

    document.getElementById("cardNumber").innerText = cardEntries.cardNumber;
    document.getElementById("CVC").innerText = cardEntries.CVC;
    document.getElementById("expireCard").innerText = cardEntries.expDate;
    document.getElementById("cardBalance").innerText = `$${myMoney}`;

    // pfp

    const uploadedIMG = document.getElementById("uploaded");
    const photo = document.getElementById("photo");
    if (userInfo.userPFP) {
      photo.src = userInfo.userPFP;
    }

    uploadedIMG.addEventListener("change", function () {
      const file = this.files[0];

      if (!file) return;

      const reader = new FileReader();

      reader.onload = function (e) {
        const imgData = e.target.result;
        photo.src = imgData;

        userInfo.userPFP = imgData;
        localStorage.setItem(currentMail, JSON.stringify(userInfo));
      };

      reader.readAsDataURL(file);
      alert("Profile Picture Uploaded!");
    });
    function logout() {
      if (confirm("Do you want to logout?")) {
        localStorage.removeItem("currentEmail");
      } else {
        return;
      }
      location.reload();
      localStorage.removeItem(currentMail + "biometricVerification");
    }

    function editName() {
      const input = document.getElementById("inputEditName");

      input.value = userInfo.username;
      input.placeholder = "";

      document.getElementById("insertUsername").classList.add("hidden");
      document.getElementById("nameEditBtn").classList.add("hidden");
      document.getElementById("changeYourName").classList.remove("hidden");

      validateNameInput();
    }
    function canceleditName() {
      document.getElementById("insertUsername").classList.remove("hidden");
      document.getElementById("nameEditBtn").classList.remove("hidden");
      document.getElementById("changeYourName").classList.add("hidden");
    }
    function newName() {
      let value = document.getElementById("inputEditName").value;
      if (value.trim() === "") {
        return;
      }
      userInfo.username = value;
      localStorage.setItem(currentMail, JSON.stringify(userInfo));
      document.getElementById("insertUsername").innerText = value;
      document.getElementById("inputEditName").value = "";
      document.getElementById("insertUsername").classList.remove("hidden");
      document.getElementById("nameEditBtn").classList.remove("hidden");
      document.getElementById("changeYourName").classList.add("hidden");
      alert("Name Updated");
    }

    const inputEditName = document.getElementById("inputEditName");
    const updateBtn = document.getElementById("updateBtn");

    function validateNameInput() {
      const value = inputEditName.value.trim();
      const isInvalid = value.length === 0 || value === userInfo.username;

      updateBtn.disabled = isInvalid;

      updateBtn.classList.toggle("bg-gray-400", isInvalid);
      updateBtn.classList.toggle("cursor-not-allowed", isInvalid);

      updateBtn.classList.toggle("bg-gray-700", !isInvalid);
      updateBtn.classList.toggle("cursor-pointer", !isInvalid);
    }

    // Run on typing
    inputEditName.addEventListener("input", validateNameInput);

    // Run immediately on page load
    validateNameInput();
  </script>
