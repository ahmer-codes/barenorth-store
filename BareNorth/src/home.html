<!doctype html>

  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Home</title>
    <style>
      .modal-overlay {
        position: fixed;
        background-color: rgba(0, 0, 0, 0.5);
        height: 100%;
        width: 100%;
        top: 0;
        left: 0;
        visibility: hidden;
        display: flex;
        justify-content: end;
      }
      .show {
        visibility: visible;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }

      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .activeSort {
        background-color: #dcdcdc;
      }
      .item .addCart {
        opacity: 0;
        transform: translateY(10px);
        pointer-events: none;
        transition:
          opacity 0.3s ease,
          transform 0.3s ease;
      }

      .item:hover .addCart {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }
    </style>
  </head>

    <div id="modal" class="modal-overlay">
