    <div class="m-1 mb-8 overflow-x-scroll scrollbar-hide">
      <table class="min-w-max mx-auto" id="theTable">
        <thead>
          <tr>
            <th
              class="w-56 bg-gray-600 text-white border-black border-2 hidden emailCol"
            >
              Email
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <button class="w-56 p-2" id="sortByID">ID</button>
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <button class="w-56 p-2" id="sortByQuant">Quantity</button>
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <p class="w-56 p-2">Products</p>
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <button class="w-56 p-2" id="sortByDate">Date</button>
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <button class="w-56 p-2" id="sortByPrice">Total Price</button>
            </th>
            <th class="w-56 p-2 bg-gray-600 text-white border-black border-2">
              Status
            </th>
          </tr>
          <tr class="text-xs">
            <th
              class="w-56 bg-gray-600 text-white border-black border-2 hidden emailCol"
            >
              <input
                id="emailSearch"
                type="text"
                maxlength="40"
                placeholder="Search Email..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg"
              />
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <input
                id="idSearch"
                type="text"
                oninput="
                  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 5)
                "
                inputmode="numeric"
                placeholder="Search ID..."
                class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"
              />
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <input
                id="quantSearch"
                oninput="
                  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 5)
                "
                type="text"
                inputmode="numeric"
                maxlength="20"
                placeholder="Search Quantity..."
                class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"
              />
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <input
                id="productSearch"
                type="text"
                maxlength="40"
                placeholder="Search Products..."
                class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"
              />
            </th>
            <th
              class="w-56 py-2 bg-gray-600 text-gray-300 border-black border-2"
            >
              <input
                id="dateSearch"
                type="date"
                placeholder="Search Date..."
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"
              />
            </th>
            <th class="w-56 bg-gray-600 text-white border-black border-2">
              <input
                id="priceSearch"
                oninput="
                  this.value = this.value.replace(/[^0-9]/g, '').slice(0, 7)
                "
                type="text"
                placeholder="Search Price..."
                class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-black"
              />
            </th>
            <th
              class="w-56 py-2 bg-gray-600 text-gray-300 border-black border-2"
            >
              <select class="cursor-pointer" name="selectStt" id="sttSearch">
                <option class="text-black" value="">-- select --</option>
                <option class="text-black" value="Delivered">Delivered</option>
                <option class="text-black" value="Pending">Pending</option>
              </select>
            </th>
          </tr>
        </thead>
        <tbody id="transaction_body_confirm">
          <!-- data in js  -->
        </tbody>
      </table>
    </div>
    <div class="flex justify-center gap-2">
      <button
        class="prev px-2 rounded-2xl cursor-pointer bg-[#f5f5f5] hover:bg-[#ececec]"
      >
        Prev
      </button>
      <div id="pagination" class="flex gap-2 justify-center"></div>
      <button
        class="nxt px-2 rounded-2xl cursor-pointer bg-[#f5f5f5] hover:bg-[#ececec]"
      >
        Next
      </button>
    </div>

    <!-- script  -->

    <script>
      let productsJSON = [];
      let currentMail = localStorage.getItem("currentEmail");
      if (!currentMail) {
        window.location.href = "login.html";
      }

      let confirmData = [];
      let homeDashboard = document.getElementById("homeDashboard");
      let allORpage = document.getElementById("allORpage");
      let profileORuser = document.getElementById("profileORuser");
      let emailCol = document.querySelectorAll(".emailCol");

      if (currentMail == "super@admin.com") {
        let allConfirm = Object.keys(localStorage)
          .filter((key) => key.endsWith("_confirm"))
          .map((key) => {
            const email = key.replace("_confirm", "");
            const orders = JSON.parse(localStorage.getItem(key)) || [];

            // Attach email to every order
            return orders.map((order) => ({
              ...order,
              userEmail: email,
            }));
          });

        confirmData = allConfirm.flat();
        console.log(confirmData);
        homeDashboard.innerText = "DashBoard";
        allORpage.innerText = "All Orders";
        profileORuser.innerText = "Users";
        profileORuser.href = "/src/admin/users.html";
        homeDashboard.href = "/src/admin/dashboard.html";
        emailCol.forEach((col) => col.classList.remove("hidden"));
      } else {
        confirmData =
          JSON.parse(localStorage.getItem(currentMail + "_confirm")) || [];
      }

      let filteredData = [...confirmData];
      let currentPage = 1;
      let itemsPerPage = 10;

      let originalConfirmData = [...confirmData];
      const tBody = document.getElementById("transaction_body_confirm");
      fetch("products.json")
        .then((res) => res.json())
        .then((data) => {
          productsJSON = data;
          showTableData(confirmData);
        });

      function showTableData(data) {
        tBody.innerHTML = "";

        const statusFiltered = data.filter((order) => order.status === "1");
        filteredData = statusFiltered;

        tBody.innerHTML = "";
        const start = (currentPage - 1) * itemsPerPage;
        const end = start + itemsPerPage;
        const paginatedItems = statusFiltered.slice(start, end);

        for (let i = 0; i < paginatedItems.length; i++) {
          let order = paginatedItems[i];
          let quantities = "";
          let productNamesList = "";
          let all_ids = [];

          for (let j = 0; j < order.items.length; j++) {
            let item = order.items[j];
            let product = productsJSON.find((p) => p.idProduct == item.pro_id);
            let productNames = product
              ? product.nameProduct
              : "Unknown Product";

            quantities += item.quantity;
            productNamesList += productNames;
            all_ids.push(item.pro_id);

            if (j < order.items.length - 1) {
              quantities += "<br>";
              productNamesList += "<br>";
            }
          }

          let hiddenClass = currentMail !== "super@admin.com" ? "hidden" : "";

          tBody.innerHTML += `<tr class="bg-gray-200 text-xs" id="t_row">
            <td class="w-56 border-2 py-2 ${hiddenClass} text-center emailCol td">${order.userEmail}</td>
            <td class="hid w-56 border-2 py-2 text-center td"><p class="idtd">${order.id || 1001 + i}</p></td>
            <td class="hid w-56 border-2 py-2 text-center td"><p class="quanttd">${quantities}</p></td>
            <td class="hid w-56 border-2 py-2 text-center td"><p class="producttd">${productNamesList}</p></td>
            <td class="hid w-56 border-2 py-2 text-center td"><p class="datetd">${order.date}</p></td>
            <td class="hid w-56 border-2 py-2 text-center td"><p class="pricetd">$${order.total}</p></td>
            <td class="hid w-56 border-2 py-2 bg-gray-600 text-center td"><button class="text-center px-2 rounded-xl text-white"><p> ${order.status === "1" ? "Delivered" : "Pending"} </p></td>
          </tr>`;
        }
        showPagination();
      }

      let searchInput = document.getElementById("searchData");

      searchInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll(".td");
          let matchFound = false;

          td.forEach((t_d) => {
            if (t_d.offsetParent === null) return;

            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });

      let searchEmailInput = document.getElementById("emailSearch");

      searchEmailInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll("td:nth-child(1)");
          let matchFound = false;

          td.forEach((t_d) => {
            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });

      let searchIDInput = document.getElementById("idSearch");

      searchIDInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll("td:nth-child(2)");
          let matchFound = false;

          td.forEach((t_d) => {
            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });

      let searchQuantInput = document.getElementById("quantSearch");

      searchQuantInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll("td:nth-child(3)");
          let matchFound = false;

          td.forEach((t_d) => {
            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });
      let searchProductInput = document.getElementById("productSearch");

      searchProductInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll("td:nth-child(4)");
          let matchFound = false;

          td.forEach((t_d) => {
            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });

      document
        .getElementById("dateSearch")
        .addEventListener("input", function () {
          const selectedDate = this.value;

          if (!selectedDate) {
            filteredData = [...originalConfirmData];
          } else {
            filteredData = originalConfirmData.filter((order) => {
              const orderDate = new Date(order.date);

              const year = orderDate.getFullYear();
              const month = String(orderDate.getMonth() + 1).padStart(2, "0");
              const day = String(orderDate.getDate()).padStart(2, "0");

              const formattedDate = `${year}-${month}-${day}`;

              return formattedDate === selectedDate;
            });
          }

          currentPage = 1;
          showTableData(filteredData);
        });

      let searchPriceInput = document.getElementById("priceSearch");

      searchPriceInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll("td:nth-child(6)");
          let matchFound = false;

          td.forEach((t_d) => {
            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });

      let searchStatusInput = document.getElementById("sttSearch");

      searchStatusInput.addEventListener("input", (e) => {
        const value = e.target.value.toLowerCase();
        const t_row = tBody.querySelectorAll("tr");

        t_row.forEach((row) => {
          const td = row.querySelectorAll("td:nth-child(7)");
          let matchFound = false;

          td.forEach((t_d) => {
            const text = t_d.innerText.toLowerCase();

            if (text.includes(value) && value !== "") {
              t_d.classList.add("bg-yellow-600", "text-white");
              matchFound = true;
            } else {
              t_d.classList.remove("bg-yellow-600", "text-white");
            }
          });

          row.style.display = matchFound || value === "" ? "" : "none";
        });
      });

      let sortByID = document.getElementById("sortByID");
      let sortByDate = document.getElementById("sortByDate");
      let sortByPrice = document.getElementById("sortByPrice");
      let sortByQuant = document.getElementById("sortByQuant");

      sortByID.addEventListener("click", () => {
        if (sortByID.classList.contains("activeSort")) {
          showTableData(originalConfirmData);
          sortByID.classList.remove("activeSort");
        } else {
          sorted = [...confirmData];
          sorted.sort((a, b) => (a.id || 0) - (b.id || 0));
          showTableData(sorted);
          sortByID.classList.add("activeSort");
          sortByDate.classList.remove("activeSort");
          sortByPrice.classList.remove("activeSort");
        }
      });

      function getTotalQuantity(order) {
        return order.items.reduce((sum, item) => sum + item.quantity, 0);
      }

      let sortQuantAsc = true;

      document.getElementById("sortByQuant").addEventListener("click", () => {
        filteredData.sort((a, b) => {
          let totalA = getTotalQuantity(a);
          let totalB = getTotalQuantity(b);

          return sortQuantAsc ? totalA - totalB : totalB - totalA;
        });

        sortQuantAsc = !sortQuantAsc;

        currentPage = 1;
        showTableData(filteredData);
      });

      sortByDate.addEventListener("click", () => {
        if (sortByDate.classList.contains("activeSort")) {
          showTableData(originalConfirmData);
          sortByDate.classList.remove("activeSort");
        } else {
          sorted = [...confirmData];
          sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
          showTableData(sorted);
          sortByDate.classList.add("activeSort");
          sortByID.classList.remove("activeSort");
          sortByQuant.classList.remove("activeSort");
          sortByPrice.classList.remove("activeSort");
        }
      });
      sortByPrice.addEventListener("click", () => {
        if (sortByPrice.classList.contains("activeSort")) {
          sorted = [...confirmData];
          sorted.sort((a, b) => a.total - b.total);
          showTableData(sorted);
          sortByPrice.classList.remove("activeSort");
          sortByQuant.classList.remove("activeSort");
          sortByID.classList.remove("activeSort");
          sortByDate.classList.remove("activeSort");
        } else {
          sorted = [...confirmData];
          sorted.sort((a, b) => b.total - a.total);
          showTableData(sorted);
          sortByPrice.classList.add("activeSort");
          sortByQuant.classList.remove("activeSort");
          sortByID.classList.remove("activeSort");
          sortByDate.classList.remove("activeSort");
        }
      });

      // pagination

      const showPagination = () => {
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        const container = document.getElementById("pagination");
        container.innerHTML = "";

        for (let i = 1; i <= totalPages; i++) {
          const btn = document.createElement("button");
          btn.innerText = i;
          btn.classList.add("px-3", "py-1", "cursor-pointer", "border");

          if (i === currentPage) {
            btn.classList.add("bg-gray-600", "cursor-pointer", "text-white");
          }

          btn.addEventListener("click", () => {
            currentPage = i;
            showTableData(filteredData);
          });

          container.appendChild(btn);
        }
      };

      document.querySelector(".prev").addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage--;
          showTableData(filteredData);
        }
      });

      document.querySelector(".nxt").addEventListener("click", () => {
        const totalPages = Math.ceil(filteredData.length / itemsPerPage);

        if (currentPage < totalPages) {
          currentPage++;
          showTableData(filteredData);
        }
      });

      // show/hide

      function toggleColumn(columnIndex, hide) {
        const rows = document.querySelectorAll("#theTable tr");

        rows.forEach((row) => {
          const t_row = row.children[columnIndex];
          if (t_row) {
            t_row.style.display = hide ? "none" : "";
          }
        });
      }

      function showID() {
        document.getElementById("showiconID").classList.remove("hidden");
        document.getElementById("hideiconID").classList.add("hidden");

        toggleColumn(1, false);
      }
      function hideID() {
        document.getElementById("showiconID").classList.add("hidden");
        document.getElementById("hideiconID").classList.remove("hidden");

        toggleColumn(1, true);
      }
      function showQuant() {
        document.getElementById("showiconQuant").classList.remove("hidden");
        document.getElementById("hideiconQuant").classList.add("hidden");
        toggleColumn(2, false);
      }
      function hideQuant() {
        document.getElementById("showiconQuant").classList.add("hidden");
        document.getElementById("hideiconQuant").classList.remove("hidden");
        toggleColumn(2, true);
      }
      function showProduct() {
        document.getElementById("showiconProduct").classList.remove("hidden");
        document.getElementById("hideiconProduct").classList.add("hidden");
        toggleColumn(3, false);
      }
      function hideProduct() {
        document.getElementById("showiconProduct").classList.add("hidden");
        document.getElementById("hideiconProduct").classList.remove("hidden");
        toggleColumn(3, true);
      }
      function showDate() {
        document.getElementById("showiconDate").classList.remove("hidden");
        document.getElementById("hideiconDate").classList.add("hidden");
        toggleColumn(4, false);
      }
      function hideDate() {
        document.getElementById("showiconDate").classList.add("hidden");
        document.getElementById("hideiconDate").classList.remove("hidden");
        toggleColumn(4, true);
      }
      function showPrice() {
        document.getElementById("showiconPrice").classList.remove("hidden");
        document.getElementById("hideiconPrice").classList.add("hidden");
        toggleColumn(5, false);
      }
      function hidePrice() {
        document.getElementById("showiconPrice").classList.add("hidden");
        document.getElementById("hideiconPrice").classList.remove("hidden");
        toggleColumn(5, true);
      }
      function showStatus() {
        document.getElementById("showiconStatus").classList.remove("hidden");
        document.getElementById("hideiconStatus").classList.add("hidden");
        toggleColumn(6, false);
      }
      function hideStatus() {
        document.getElementById("showiconStatus").classList.add("hidden");
        document.getElementById("hideiconStatus").classList.remove("hidden");
        toggleColumn(6, true);
      }

      // logout
      function logout() {
        if (confirm("Do you want to logout?")) {
          localStorage.removeItem("currentEmail");
        } else {
          return;
        }
        localStorage.removeItem(currentMail + "biometricVerification");
        location.reload();
      }
    </script>
  </body>
</html>
