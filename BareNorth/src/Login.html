<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Login</title>
  </head>
  <body>
    <h1>
      <img
        src="Imgs/1770734094459.png"
        alt="BareNorth Logo"
        class="w-24 ml-4"
      />
    </h1>
    <section class="flex items-center flex-col">
      <p class="text-4xl font-semibold mt-12 mb-4">Login</p>
      <p>
        Don't have an existing account?
        <a href="signup.html" class="underline">Sign up</a>
      </p>
      <!-- Form  -->
      <form id="loginForm">
        <div class="mt-4">
          <label for="email">Email</label><br />
          <input
            type="email"
            id="loginEmail"
            maxlength="64"
            class="border-2 my-2 px-2 py-1 w-56"
            name="email"
            required
          />
        </div>
        <div class="mt-4">
          <div class="flex justify-between">
            <label for="password">Password</label><br />
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="mr-2 w-4 translate-y-10 showicon"
              viewBox="0 0 640 640"
              onclick="showPass()"
            >
              <path
                d="M320 96C239.2 96 174.5 132.8 127.4 176.6C80.6 220.1 49.3 272 34.4 307.7C31.1 315.6 31.1 324.4 34.4 332.3C49.3 368 80.6 420 127.4 463.4C174.5 507.1 239.2 544 320 544C400.8 544 465.5 507.2 512.6 463.4C559.4 419.9 590.7 368 605.6 332.3C608.9 324.4 608.9 315.6 605.6 307.7C590.7 272 559.4 220 512.6 176.6C465.5 132.9 400.8 96 320 96zM176 320C176 240.5 240.5 176 320 176C399.5 176 464 240.5 464 320C464 399.5 399.5 464 320 464C240.5 464 176 399.5 176 320zM320 256C320 291.3 291.3 320 256 320C244.5 320 233.7 317 224.3 311.6C223.3 322.5 224.2 333.7 227.2 344.8C240.9 396 293.6 426.4 344.8 412.7C396 399 426.4 346.3 412.7 295.1C400.5 249.4 357.2 220.3 311.6 224.3C316.9 233.6 320 244.4 320 256z"
              />
            </svg>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="mr-2 w-4 translate-y-10 hidden hideicon"
              onclick="showPass()"
              viewBox="0 0 640 512"
            >
              <path
                d="M320 400c-75.85 0-137.25-58.71-142.9-133.11L72.2 185.82c-13.79 17.3-26.48 35.59-36.72 55.59a32.35 32.35 0 0 0 0 29.19C89.71 376.41 197.07 448 320 448c26.91 0 52.87-4 77.89-10.46L346 397.39a144.13 144.13 0 0 1-26 2.61zm313.82 58.1l-110.55-85.44a331.25 331.25 0 0 0 81.25-102.07 32.35 32.35 0 0 0 0-29.19C550.29 135.59 442.93 64 320 64a308.15 308.15 0 0 0-147.32 37.7L45.46 3.37A16 16 0 0 0 23 6.18L3.37 31.45A16 16 0 0 0 6.18 53.9l588.36 454.73a16 16 0 0 0 22.46-2.81l19.64-25.27a16 16 0 0 0-2.82-22.45zm-183.72-142l-39.3-30.38A94.75 94.75 0 0 0 416 256a94.76 94.76 0 0 0-121.31-92.21A47.65 47.65 0 0 1 304 192a46.64 46.64 0 0 1-1.54 10l-73.61-56.89A142.31 142.31 0 0 1 320 112a143.92 143.92 0 0 1 144 144c0 21.63-5.29 41.79-13.9 60.11z"
              />
            </svg>
          </div>
          <input
            type="password"
            id="loginPassword"
            maxlength="40"
            class="border-2 my-2 px-2 py-1 w-56"
            name="password"
            required
          />
        </div>
        <div>
          <button
            type="submit"
            id="submit"
            class="my-6 py-2 cursor-pointer border-2 w-56 flex justify-center bg-black text-white"
          >
            Login
          </button>
          <p id="error" class="hidden text-red-600">
            No users found
            <a href="signup.html" class="underline italic">Sign up</a> first
          </p>
          <p id="wrongpass" class="hidden text-red-500">
            Wrong Password. Try again
          </p>
        </div>
      </form>

      <script>
        document
          .getElementById("loginForm")
          .addEventListener("submit", function (e) {
            e.preventDefault();

            const enteredEmail = document.getElementById("loginEmail").value;
            localStorage.setItem("currentEmail", enteredEmail);
            let x = localStorage.getItem("currentEmail");
            console.log(x);
            const enteredPassword =
              document.getElementById("loginPassword").value;

            const storedUser = JSON.parse(localStorage.getItem(enteredEmail));

            if (
              enteredEmail == "super@admin.com" &&
              enteredPassword == "12345678"
            ) {
              window.location.href = "admin/dashboard.html";
              localStorage.setItem("isAdmin", true);
            } else {
              if (!storedUser) {
                let err = document.getElementById("error");
                err.classList.remove("hidden");
                return;
              }

              if (
                enteredEmail === storedUser.email &&
                enteredPassword === storedUser.password
              ) {
                localStorage.setItem("isLoggedIn", "true");
                window.location.href = "biometric.html";
              } else {
                let wrongPass = document.getElementById("wrongpass");
                wrongPass.classList.remove("hidden");
              }
            }
          });
        function showPass() {
          var x = document.getElementById("loginPassword");
          if (x.type === "password") {
            x.type = "text";
            document.querySelector(".showicon").classList.add("hidden");
            document.querySelector(".hideicon").classList.remove("hidden");
          } else {
            x.type = "password";
            document.querySelector(".showicon").classList.remove("hidden");
            document.querySelector(".hideicon").classList.add("hidden");
          }
        }

// =============== throws an error ============= 

        let myMoney = localStorage.getItem(currentMail + "_money");
        console.log(myMoney);

        function getRandomCard(min, max) {
          const genMoney = Math.floor(Math.random() * (max - min) + min);
          return genMoney;
        }

        if (myMoney == null || myMoney == "") {
          const money = getRandomCard(1111, 9999);
          console.log(money);
          localStorage.setItem(currentMail + "_money", money);
        }

// ========== extra code =============

        // logout
        function logout() {
          if (confirm("Do you want to logout?")) {
            localStorage.removeItem("currentEmail");
          } else {
            return;
          }
          location.reload();
        }
      </script>
    </section>
  </body>
</html>
