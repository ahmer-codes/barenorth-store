<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/output.css" rel="stylesheet" />
    <title>Profile Page</title>
  </head>
  <body>
    <!-- head  -->

    <ul
      class="flex items-center justify-around max-[290px]:justify-between mr-4 font-semibold max-[800px]:text-xs"
    >
      <li>
        <h1 class="w-24">
          <img
            src="/src/Imgs/1770734094459.png"
            alt="BareNorth Logo"
            class="w-24"
          />
        </h1>
      </li>
      <li
        class="text-gray-600 hover:text-black hover:underline max-[650px]:hidden"
      >
        <a href="dashboard.html">DashBoard</a>
      </li>

      <li
        class="text-gray-600 hover:text-black hover:underline max-[450px]:hidden"
      >
        <a href="/src/orderpage.html">Order Page</a>
      </li>
      <li
        class="text-gray-600 hover:text-black hover:underline max-[650px]:hidden"
      >
        <a href="/src/transaction.html">Transaction Page</a>
      </li>
      <li
        class="text-gray-600 hover:text-black hover:underline max-[650px]:hidden"
      >
        <a href="/src/logs.html">Login Details</a>
      </li>
      <li class="text-black font-bold max-[650px]:hidden">
        <a href="">Users</a>
      </li>
      <li
        class="min-[650px]:hidden max-[450px]:hidden text-black font-semibold"
      >
        Your Account
      </li>
      <li title="logout">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          onclick="logout()"
          class="icon icon-tabler icons-tabler-outline icon-tabler-logout cursor-pointer"
        >
          <path stroke="none" d="M0 0h24v24H0z" fill="none" />
          <path
            d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2"
          />
          <path d="M9 12h12l-3 -3" />
          <path d="M18 15l3 -3" />
        </svg>
      </li>
    </ul>

    <!-- mobile view head  -->

    <nav
      class="flex flex-col items-center justify-center w-full min-[450px]:hidden"
    >
      <ul
        class="flex flex-col items-center w-full justify-center gap-2 border-gray-400 bg-gray-200 text-gray-700"
      >
        <li class="p-2 cursor-pointer font-semibold hover:text-black">
          <a href="">DashBoard</a>
        </li>
        <li class="p-2 cursor-pointer font-semibold hover:text-black">
          Order Page
        </li>
        <li class="p-2 cursor-pointer font-semibold hover:text-black">
          Transaction Page
        </li>
        <li class="p-2 cursor-pointer font-semibold hover:text-black">
          Login Detail
        </li>
        <li class="p-2 cursor-pointer font-semibold hover:text-black">
          Profile Page
        </li>
      </ul>
    </nav>

    <!-- ========= body ==========  -->

    <section class="flex items-center flex-col mb-4">
      <p class="text-4xl font-semibold">Users</p>
    </section>
    <section class="flex flex-wrap justify-around gap-6 mx-24" id="container">
      <!-- Data in JS  -->
    </section>
  </body>

  <script>
    // getting current email

    let currentMail = localStorage.getItem("currentEmail");
    if (currentMail != "super@admin.com") {
      localStorage.removeItem("currentEmail");
      window.location.href = "/src/Login.html";
    }

    // showing data of each user

    let container = document.getElementById("container");

    for (let i = 0; i < localStorage.length; i++) {
      let key = localStorage.key(i);

      if (key.includes("@") && !key.includes("_")) {
        let raw = localStorage.getItem(key);

        console.log("User raw data:", raw);

        let user = JSON.parse(raw);

        console.log("Parsed user:", user);

        let money = localStorage.getItem(key + "_money") || 0;

        container.innerHTML += `
        <div class="">
        <div
          class="flex justify-between w-100 max-[450px]:w-56 bg-gray-200 p-4 border border-gray-300 rounded-t-lg"
        >
          <p>Name</p>
          <div class="flex">
            <p class="text-gray-600">${user.username}</p>
            <div class="w-12"></div>
          </div>
        </div>
        <div
          class="flex justify-between w-100 max-[450px]:w-56 bg-gray-200 p-4 border border-gray-300"
        >
          <p>Email</p>
          <div class="flex">
            <p class="text-gray-600">${user.email}</p>
            <div class="w-12"></div>
          </div>
        </div>
        <div
          class="flex justify-between w-100 max-[450px]:w-56 bg-gray-200 p-4 border border-gray-300"
        >
          <p>Card Number</p>
          <div class="flex">
            <p class="text-gray-600">88043169502378</p>
            <div class="w-12"></div>
          </div>
        </div>
        <div
          class="flex justify-between w-100 max-[450px]:w-56 bg-gray-200 p-4 border rounded-br-lg rounded-bl-lg border-gray-300"
        >
          <p>Current Balance</p>
          <div class="flex">
            <p class="text-gray-600">${money}</p>
            <div class="w-12"></div>
          </div>
        </div>
      </div>
        `;
      }
    }

    // logout funt=ction

    function logout() {
      if (confirm("Do you want to logout?")) {
        localStorage.removeItem("currentEmail");
      } else {
        return;
      }
      location.reload();
      localStorage.removeItem(currentMail + "biometricVerification");
    }
  </script>
</html>
